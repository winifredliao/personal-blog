services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////app/data/blog.db
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      - BACKEND_HOST=backend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
