services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:////app/data/blog.db
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
